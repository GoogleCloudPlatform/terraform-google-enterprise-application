timeout: 18000s
steps:
  - id: prepare
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      [
        "/bin/bash",
        "-c",
        "source /usr/local/bin/task_helper_functions.sh && prepare_environment",
      ]
    env:
      - "TF_VAR_org_id=$_ORG_ID"
      - "TF_VAR_folder_id=$_FOLDER_ID"
      - "TF_VAR_billing_account=$_BILLING_ACCOUNT"
      - "TF_VAR_create_cloud_nat=true" # config-sync running on cluster VPC needs to access gitlab

  - id: logging-bucket-init
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestLoggingBucket --stage init --verbose"]
    waitFor:
      - prepare
    allowFailure: true

  - id: logging-bucket-apply
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestLoggingBucket --stage apply --verbose"]
    waitFor:
      - logging-bucket-init
    allowFailure: true

  - id: vpc-sc
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      [
        "/bin/bash",
        "-c",
        "cft test run TestVPCSC --stage init --verbose && cft test run TestVPCSC --stage apply --verbose",
      ]
    env:
      - "TF_VAR_org_id=$_ORG_ID"
    waitFor:
      - logging-bucket-apply

  - id: multicluster-discovery-example-init
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestMultiClusterDiscovery --stage init --verbose"]
    waitFor:
      - vpc-sc
    env:
      - "TF_VAR_org_id=$_ORG_ID"
      - "TF_VAR_billing_account=$_BILLING_ACCOUNT"

  - id: multicluster-discovery-example-apply
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestMultiClusterDiscovery --stage apply --verbose"]
    waitFor:
      - multicluster-discovery-example-init
    env:
      - "TF_VAR_org_id=$_ORG_ID"
      - "TF_VAR_billing_account=$_BILLING_ACCOUNT"

  - id: multicluster-discovery-example-verify
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestMultiClusterDiscovery --stage verify --verbose"]
    waitFor:
      - multicluster-discovery-example-apply
    env:
      - "TF_VAR_org_id=$_ORG_ID"
      - "TF_VAR_billing_account=$_BILLING_ACCOUNT"
  
  - id: multicluster-discovery-example-teardown
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestMultiClusterDiscovery --stage teardown --verbose"]
    waitFor:
      - multicluster-discovery-example-verify
    env:
      - "TF_VAR_org_id=$_ORG_ID"
      - "TF_VAR_billing_account=$_BILLING_ACCOUNT"

  - id: vpcsc-teardown
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      [
        "/bin/bash",
        "-c",
        "sleep 3m && cft test run TestVPCSC  --stage teardown --verbose",
      ]
    waitFor:
      - multicluster-discovery-example-teardown
    allowFailure: true

  - id: gitlab-teardown
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestGitLab --stage teardown --verbose"]
    waitFor:
      - vpcsc-teardown
    allowFailure: true

  - id: logging-bucket-teardown
    name: "gcr.io/cloud-foundation-cicd/$_DOCKER_IMAGE_DEVELOPER_TOOLS:$_DOCKER_TAG_VERSION_DEVELOPER_TOOLS"
    args:
      ["/bin/bash", "-c", "cft test run TestLoggingBucket --stage teardown --verbose"]
    waitFor:
      - gitlab-teardown
      - private-workerpool-teardown
    allowFailure: true

tags:
  - "ci"
  - "integration"
substitutions:
  _DOCKER_IMAGE_DEVELOPER_TOOLS: "cft/developer-tools"
  _DOCKER_TAG_VERSION_DEVELOPER_TOOLS: "1.25"
options:
  machineType: E2_HIGHCPU_32
  env:
    - 'TF_PLUGIN_CACHE_DIR=""'
    - 'TF_VAR_branch_name=$BRANCH_NAME'
    - "TF_VAR_service_perimeter_mode=ENFORCE"
    - "TF_VAR_deletion_protection=false"
    - "TF_VAR_cloud_build_sa=$SERVICE_ACCOUNT_EMAIL"
    - "TF_VAR_single_project=true"
    - "TF_VAR_hpc=false"
    - "TF_VAR_agent=false"
    - "HEAD_BRANCH=$_HEAD_BRANCH"
    - "HEAD_REPO_URL=$_HEAD_REPO_URL"
