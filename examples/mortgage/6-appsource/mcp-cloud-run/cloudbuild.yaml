steps:
  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    id: 'build-legacy-dms'
    args: ['build', '-t', '$_CONTAINER_REGISTRY/legacy-dms:latest', 'src/legacy-dms']

  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    id: 'build-income-verification'
    args: ['build', '-t', '$_CONTAINER_REGISTRY/income-verification:latest', 'src/income-verification']

  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    id: 'build-corporate-email'
    args: ['build', '-t', '$_CONTAINER_REGISTRY/corporate-email:latest', 'src/corporate-email']

images:
  - '$_CONTAINER_REGISTRY/legacy-dms:latest'
  - '$_CONTAINER_REGISTRY/income-verification:latest'
  - '$_CONTAINER_REGISTRY/corporate-email:latest'

substitutions:
  _CONTAINER_REGISTRY: ''

options:
  logging: CLOUD_LOGGING_ONLY
