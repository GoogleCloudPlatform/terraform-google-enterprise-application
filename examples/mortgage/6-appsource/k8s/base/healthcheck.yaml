apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: mortgage-agent-healthcheck-policy
spec:
  targetRef:
    group: ""
    kind: Service
    name: mortgage-agent-service
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /health
